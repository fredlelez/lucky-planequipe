<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Démo Planequipe">
<title>Démo Planequipe — Parcours métiers</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --nuit:#0d1f3c; --nuit2:#13294f; --bleu:#2563eb; --bleu-clair:#60a5fa;
    --orange:#f97316; --vert:#10b981; --rouge:#ef4444; --jaune:#f59e0b;
    --carte:#ffffff; --texte:#1e293b; --gris:#94a3b8; --bordure:rgba(255,255,255,0.1);
  }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  body {
    background:linear-gradient(160deg,#0a1628 0%,#13294f 50%,#0a1628 100%);
    color:#e2e8f0; overflow:hidden; position:fixed; width:100%; background-attachment:fixed;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 85% 30%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 75% 80%, rgba(255,255,255,0.3), transparent);
  }
  #app { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; }

  .topbar {
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    background:linear-gradient(180deg, rgba(13,31,60,0.95), rgba(13,31,60,0.8));
    border-bottom:2px solid var(--bleu); flex-shrink:0; box-shadow:0 2px 20px rgba(0,0,0,0.3);
  }
  .astra-mini {
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 50% 40%, #60a5fa, #2563eb);
    box-shadow:0 0 20px rgba(96,165,250,0.6); position:relative;
  }
  .astra-mini::before { content:''; position:absolute; width:8px; height:8px; border-radius:50%; background:#fff; left:13px; top:16px; box-shadow:14px 0 0 #fff; }
  .astra-mini::after { content:''; position:absolute; width:14px; height:6px; border-radius:0 0 8px 8px; background:rgba(255,255,255,0.7); bottom:13px; left:15px; }
  .topbar-title { flex:1; }
  .topbar-title .astra-name { font-size:20px; font-weight:800; color:#fff; letter-spacing:1px; }
  .topbar-title .screen-name { font-size:12px; color:var(--bleu-clair); margin-top:2px; }
  .topbar-tag { color:#fff; font-size:11px; font-weight:700; padding:5px 12px; border-radius:20px; letter-spacing:0.5px; display:none; }

  .screen-zone { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px; }
  .screen { display:none; animation:fadeIn 0.4s ease; }
  .screen.active { display:block; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .etape-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(37,99,235,0.2); border:1px solid rgba(96,165,250,0.4); color:var(--bleu-clair); font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; margin-bottom:16px; letter-spacing:0.5px; }
  .etape-num { background:var(--bleu); color:#fff; width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }

  .astra-bubble { display:flex; gap:12px; align-items:flex-start; margin-bottom:18px; background:linear-gradient(135deg, rgba(37,99,235,0.18), rgba(37,99,235,0.08)); border-left:3px solid var(--bleu-clair); border-radius:0 14px 14px 0; padding:14px 16px; }
  .astra-avatar { width:38px; height:38px; border-radius:50%; flex-shrink:0; background:radial-gradient(circle at 50% 40%, #93c5fd, #2563eb); box-shadow:0 0 14px rgba(96,165,250,0.5); position:relative; }
  .astra-avatar::before { content:''; position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; left:11px; top:13px; box-shadow:11px 0 0 #fff; }
  .astra-avatar::after { content:''; position:absolute; width:11px; height:5px; border-radius:0 0 6px 6px; background:rgba(255,255,255,0.8); bottom:11px; left:13px; }
  .astra-bubble-text { flex:1; font-size:14px; line-height:1.5; color:#dbeafe; }
  .astra-bubble-text b { color:#fff; }
  .astra-bubble-label { font-size:10px; font-weight:700; color:var(--bleu-clair); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }

  .carte { background:var(--carte); color:var(--texte); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,0.2); }
  .carte-titre { font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--bleu); margin-bottom:12px; }

  .champ { margin-bottom:12px; }
  .champ-label { font-size:12px; color:var(--gris); margin-bottom:5px; display:block; font-weight:600; }
  .champ-valeur { background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:10px; padding:11px 14px; font-size:15px; color:var(--texte); font-weight:600; }
  .champ-valeur.geoloc { display:flex; align-items:center; gap:8px; }

  .photos-row { display:flex; gap:8px; margin-top:8px; }
  .photo-thumb { flex:1; height:70px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; position:relative; }
  .photo-thumb span { position:relative; z-index:1; }
  .photo-label { position:absolute; bottom:3px; left:0; right:0; text-align:center; font-size:8px; color:#fff; z-index:1; }

  .presta-ligne { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f1f5f9; }
  .presta-ligne:last-child { border-bottom:none; }
  .presta-icone { width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; background:#eff6ff; }
  .presta-info { flex:1; }
  .presta-nom { font-size:14px; font-weight:700; color:var(--texte); }
  .presta-detail { font-size:12px; color:var(--gris); margin-top:2px; }
  .presta-prix { font-size:15px; font-weight:800; color:var(--bleu); }

  .alerte-coherence { display:flex; gap:10px; align-items:flex-start; background:#fff7ed; border:1px solid #fed7aa; border-radius:12px; padding:12px 14px; margin:12px 0; }
  .alerte-coherence .ico { font-size:18px; }
  .alerte-coherence .txt { font-size:12px; color:#9a3412; line-height:1.4; }
  .alerte-coherence .txt b { color:#7c2d12; }

  .total-box { background:linear-gradient(135deg,#eff6ff,#dbeafe); border-radius:14px; padding:16px; margin-top:8px; }
  .total-detail { display:flex; justify-content:space-between; font-size:13px; color:#475569; padding:4px 0; }
  .total-detail.grand { border-top:2px solid #bfdbfe; margin-top:8px; padding-top:10px; }
  .total-detail.grand .v { font-size:24px; font-weight:800; color:var(--orange); }
  .total-detail.grand .l { font-size:15px; font-weight:700; color:var(--texte); align-self:center; }

  .proposition { background:var(--carte); color:var(--texte); border-radius:14px; padding:14px; margin-bottom:12px; border:2px solid transparent; position:relative; }
  .proposition.best { border-color:var(--orange); box-shadow:0 0 0 4px rgba(249,115,22,0.15); }
  .proposition.best::before { content:'★ CHOIX RECOMMANDÉ PAR ASTRA'; position:absolute; top:-10px; left:14px; background:var(--orange); color:#fff; font-size:9px; font-weight:800; padding:3px 10px; border-radius:10px; letter-spacing:0.5px; }
  .prop-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .prop-titre { font-size:15px; font-weight:800; color:var(--nuit); }
  .prop-score { font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; background:#ecfdf5; color:var(--vert); }
  .prop-ligne { display:flex; align-items:center; gap:8px; font-size:13px; color:#475569; padding:3px 0; }
  .prop-ligne .ico { width:18px; text-align:center; }

  .recap-mission { background:linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05)); border:1px solid rgba(16,185,129,0.3); border-radius:14px; padding:16px; margin-top:8px; }
  .recap-mission .titre { font-size:12px; font-weight:700; color:var(--vert); margin-bottom:8px; }
  .recap-mission .ligne { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:#cbd5e1; }
  .recap-mission .ligne b { color:#fff; }

  .navbar { display:flex; align-items:center; gap:12px; padding:14px 20px; background:linear-gradient(0deg, rgba(13,31,60,0.98), rgba(13,31,60,0.85)); border-top:1px solid var(--bordure); flex-shrink:0; }
  .nav-progress { flex:1; display:flex; gap:6px; }
  .nav-dot { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,0.15); transition:0.3s; }
  .nav-dot.done { background:var(--bleu); }
  .nav-dot.current { background:var(--orange); }
  .nav-btn { border:none; border-radius:12px; padding:13px 24px; font-size:15px; font-weight:700; cursor:pointer; transition:0.2s; font-family:inherit; }
  .nav-btn.prev { background:rgba(255,255,255,0.1); color:#cbd5e1; }
  .nav-btn.next { background:var(--orange); color:#fff; box-shadow:0 4px 14px rgba(249,115,22,0.4); }
  .nav-btn:active { transform:scale(0.96); }
  .nav-btn:disabled { opacity:0.3; pointer-events:none; }

  .ecran-titre { font-size:22px; font-weight:800; color:#fff; margin-bottom:6px; }
  .ecran-sous { font-size:13px; color:var(--gris); margin-bottom:18px; }
  .secteur-pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; margin-bottom:14px; }

  .intro-screen { text-align:center; padding:20px 10px; }
  .intro-logo { font-size:32px; font-weight:800; color:#fff; letter-spacing:2px; margin-bottom:8px; }
  .intro-logo .diamond { color:var(--bleu-clair); }
  .intro-tagline { font-size:14px; color:var(--bleu-clair); margin-bottom:24px; }
  .intro-astra { width:90px; height:90px; border-radius:50%; margin:0 auto 24px; background:radial-gradient(circle at 50% 40%, #93c5fd, #2563eb); box-shadow:0 0 40px rgba(96,165,250,0.6); position:relative; animation:pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 40px rgba(96,165,250,0.5);} 50%{box-shadow:0 0 60px rgba(96,165,250,0.8);} }
  .intro-astra::before { content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; left:26px; top:32px; box-shadow:24px 0 0 #fff; }
  .intro-astra::after { content:''; position:absolute; width:24px; height:11px; border-radius:0 0 14px 14px; background:rgba(255,255,255,0.85); bottom:26px; left:33px; }
  .intro-titre { font-size:24px; font-weight:800; color:#fff; margin-bottom:14px; }
  .intro-desc { font-size:15px; color:#cbd5e1; line-height:1.6; max-width:480px; margin:0 auto 10px; }
  .intro-parcours { background:rgba(37,99,235,0.15); border:1px solid rgba(96,165,250,0.3); border-radius:14px; padding:16px; margin:24px auto 0; max-width:480px; text-align:left; }
  .intro-parcours .t { font-size:11px; font-weight:700; color:var(--bleu-clair); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  .intro-parcours .etape { display:flex; align-items:center; gap:10px; font-size:13px; color:#dbeafe; padding:5px 0; }
  .intro-parcours .etape .n { background:var(--bleu); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }

  .client-rappelle { display:flex; align-items:center; gap:14px; background:var(--carte); color:var(--texte); border-radius:14px; padding:16px; margin-bottom:14px; }
  .phone-icon { width:50px; height:50px; border-radius:50%; background:#eff6ff; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; animation:ring 1s ease-in-out infinite; }
  @keyframes ring { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-12deg);} 75%{transform:rotate(12deg);} }
  .client-rappelle .info { flex:1; }
  .client-rappelle .nom { font-size:16px; font-weight:700; }
  .client-rappelle .sous { font-size:13px; color:var(--gris); margin-top:2px; }

  .patient-card { display:flex; align-items:center; gap:14px; }
  .patient-photo { width:54px; height:54px; border-radius:50%; flex-shrink:0; font-size:26px; background:#eff6ff; display:flex; align-items:center; justify-content:center; }
  .badge-soin { display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px; margin:2px 4px 2px 0; }
  .badge-urgent { background:#fee2e2; color:#b91c1c; }

  /* ── MENU SÉLECTION SECTEUR ── */
  .secteur-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .secteur-btn {
    background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:18px 14px; cursor:pointer; transition:0.2s; text-align:center;
  }
  .secteur-btn:active { transform:scale(0.96); }
  .secteur-btn .ico { font-size:34px; display:block; margin-bottom:8px; }
  .secteur-btn .nom { font-size:14px; font-weight:700; color:#fff; }
  .secteur-btn .logique { font-size:10px; color:var(--bleu-clair); margin-top:4px; }
  .menu-titre { font-size:22px; font-weight:800; color:#fff; text-align:center; margin-bottom:6px; }
  .menu-sous { font-size:13px; color:var(--gris); text-align:center; margin-bottom:22px; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="astra-mini"></div>
    <div class="topbar-title">
      <div class="astra-name">Astra</div>
      <div class="screen-name" id="screen-name">Sélection du métier</div>
    </div>
    <div class="topbar-tag" id="topbar-tag"></div>
  </div>

  <div class="screen-zone" id="screen-zone"></div>

  <div class="navbar" id="navbar" style="display:none;">
    <button class="nav-btn prev" id="btn-prev" onclick="prevScreen()">←</button>
    <div class="nav-progress" id="progress"></div>
    <button class="nav-btn next" id="btn-next" onclick="nextScreen()">Suivant →</button>
  </div>

</div>

<script>
/* ════════════════════════════════════════════
   DONNÉES DES PARCOURS PAR MÉTIER
   ════════════════════════════════════════════ */

var SECTEURS = [
  { id:'ev',  nom:'Espaces Verts',        ico:'🌿', logique:'devis',   couleur:'#65a30d' },
  { id:'ni',  nom:'Nettoyage Industriel', ico:'🧹', logique:'devis',   couleur:'#0891b2' },
  { id:'ci',  nom:'Cabinet Infirmier',    ico:'🩺', logique:'directe', couleur:'#10b981' },
  { id:'amb', nom:'Ambulances / VSL',     ico:'🚑', logique:'directe', couleur:'#dc2626' },
  { id:'ram', nom:'Ramonage',             ico:'🧰', logique:'directe', couleur:'#78716c' },
  { id:'liv', nom:'Livraison Boissons',   ico:'🍺', logique:'directe', couleur:'#d97706' },
  { id:'agr', nom:'Entretien Agricole',   ico:'🚜', logique:'directe', couleur:'#ca8a04' }
];

/* Chaque parcours = tableau d'écrans HTML.
   2 trames : "devis" (6 étapes) et "directe" (5 étapes) */

var PARCOURS = {};
</script>
<script>
/* ════════════════════════════════════════════
   PARCOURS DÉTAILLÉS — 7 MÉTIERS
   Trame "devis" : 6 écrans (intro, arrivée, écoute, cohérence, prix, accepte, plan, fin)
   Trame "directe": 6 écrans (intro, appel, identif, recherche, propositions, fin)
   ════════════════════════════════════════════ */

/* Helper visuel réutilisable pour intro */
function introHTML(secteurNom, ico, titre, desc, etapes) {
  var e = etapes.map(function(t, i){
    return '<div class="etape"><span class="n">' + (i+1) + '</span> ' + t + '</div>';
  }).join('');
  return '<div class="intro-screen">'
    + '<div class="intro-astra"></div>'
    + '<div class="intro-logo"><span class="diamond">◆</span> PLANEQUIPE</div>'
    + '<div class="intro-tagline">' + ico + ' ' + secteurNom + '</div>'
    + '<div class="intro-titre">' + titre + '</div>'
    + '<div class="intro-desc">' + desc + '</div>'
    + '<div class="intro-parcours"><div class="t">Le parcours</div>' + e + '</div>'
    + '</div>';
}

function finHTML(titre, desc, recapTitre, recap, message) {
  var r = recap.map(function(l){
    return '<div class="ligne"><span>' + l[0] + '</span><b>' + l[1] + '</b></div>';
  }).join('');
  return '<div class="intro-screen">'
    + '<div style="font-size:64px; margin-bottom:16px;">✅</div>'
    + '<div class="intro-titre">' + titre + '</div>'
    + '<div class="intro-desc">' + desc + '</div>'
    + '<div class="recap-mission" style="max-width:480px; margin:24px auto 0;">'
    + '<div class="titre">' + recapTitre + '</div>' + r + '</div>'
    + '<div class="intro-parcours" style="max-width:480px;"><div class="t">💡 La force de Planequipe</div>'
    + '<div style="font-size:13px; color:#dbeafe; line-height:1.6;">' + message + '</div></div>'
    + '</div>';
}

/* ─────────────────────────────────────────────
   1. ESPACES VERTS (devis)
   ───────────────────────────────────────────── */
PARCOURS.ev = [
  { name:'Bienvenue', html: introHTML('Espaces Verts','🌿','Parcours type — Espaces Verts',
    "Suivez une demande client du devis terrain jusqu'à la planification automatique.",
    ['Arrivée chez le client + géolocalisation','Astra écoute, le devis se construit','Contrôle de cohérence automatique','Calcul du prix + envoi','Le client accepte par téléphone','Planification automatique']) },

  { name:'Devis terrain — Arrivée', html:
    '<div class="etape-badge"><span class="etape-num">1</span> ARRIVÉE CHEZ LE CLIENT</div>'
    + '<div class="secteur-pill" style="background:rgba(101,163,13,0.2); border:1px solid rgba(101,163,13,0.4); color:#a3e635;">🌿 Espaces Verts</div>'
    + '<div class="ecran-titre">Nouveau devis terrain</div>'
    + '<div class="ecran-sous">Le commercial arrive chez le client avec sa tablette</div>'
    + '<div class="astra-bubble"><div class="astra-avatar"></div><div class="astra-bubble-text"><div class="astra-bubble-label">Astra</div>Bonjour ! Je vous géolocalise. Prenez quelques photos de l\'accès et du terrain, puis présentez-moi le client.</div></div>'
    + '<div class="carte"><div class="carte-titre">📍 Lieu d\'intervention</div>'
    + '<div class="champ"><span class="champ-label">Adresse (géolocalisée)</span><div class="champ-valeur geoloc">📍 12 route de Kerlann, 29410 Saint-Thégonnec</div></div>'
    + '<div class="champ"><span class="champ-label">Photos du site</span><div class="photos-row">'
    + '<div class="photo-thumb" style="background:linear-gradient(135deg,#84cc16,#65a30d);"><span>🌳</span><div class="photo-label">Terrain</div></div>'
    + '<div class="photo-thumb" style="background:linear-gradient(135deg,#64748b,#475569);"><span>🚪</span><div class="photo-label">Accès</div></div>'
    + '<div class="photo-thumb" style="background:linear-gradient(135deg,#3b82f6,#2563eb);"><span>🅿️</span><div class="photo-label">Parking</div></div>'
    + '</div></div></div>'
    + '<div class="carte"><div class="carte-titre">👤 Client</div><div class="champ"><span class="champ-label">Nom / Contact</span><div class="champ-valeur">M. Hervé Tanguy — Particulier</div></div></div>' },

  { name:'Astra écoute le client', html:
    '<div class="etape-badge"><span class="etape-num">2</span> ASTRA ÉCOUTE LA DEMANDE</div>'
    + '<div class="ecran-titre">Le client explique son besoin</div>'
    + '<div class="ecran-sous">Astra transcrit en temps réel — le commercial vérifie</div>'
    + '<div class="astra-bubble"><div class="astra-avatar"></div><div class="astra-bubble-text"><div class="astra-bubble-label">Astra écoute…</div>« J\'ai une <b>pelouse à tondre</b> d\'environ 600 m², une <b>haie à tailler</b> le long du portail, et pas mal de <b>déchets verts</b> à évacuer. »</div></div>'
    + '<div class="carte"><div class="carte-titre">🌿 Prestations identifiées</div>'
    + '<div class="presta-ligne"><div class="presta-icone" style="background:#ecfdf5;">🌱</div><div class="presta-info"><div class="presta-nom">Tonte de pelouse</div><div class="presta-detail">600 m² · cadence 600 m²/h</div></div><div class="presta-prix">1 h</div></div>'
    + '<div class="presta-ligne"><div class="presta-icone" style="background:#ecfdf5;">✂️</div><div class="presta-info"><div class="presta-nom">Taille de haie</div><div class="presta-detail">~25 m linéaires · le long du portail</div></div><div class="presta-prix">2 h</div></div>'

<script>
/* ════════════════════════════════════════════
   MOTEUR DE NAVIGATION
   ════════════════════════════════════════════ */
var current = 0;
var screensData = [];
var zone = document.getElementById('screen-zone');
var navbar = document.getElementById('navbar');
var progress = document.getElementById('progress');

function renderMenu() {
  navbar.style.display = 'none';
  document.getElementById('topbar-tag').style.display = 'none';
  document.getElementById('screen-name').textContent = 'Sélection du métier';
  var html = '<div class="screen active"><div class="intro-screen">'
    + '<div class="intro-astra"></div>'
    + '<div class="intro-logo"><span class="diamond">◆</span> PLANEQUIPE</div>'
    + '<div class="intro-tagline">La planification optimisée au service de la performance</div>'
    + '<div class="menu-titre">Quel est votre métier ?</div>'
    + '<div class="menu-sous">Découvrez comment Planequipe transforme votre quotidien</div>'
    + '<div class="secteur-grid">';
  SECTEURS.forEach(function(s) {
    html += '<div class="secteur-btn" onclick="lancerParcours(\'' + s.id + '\')">'
      + '<span class="ico">' + s.ico + '</span>'
      + '<div class="nom">' + s.nom + '</div>'
      + '<div class="logique">' + (s.logique === 'devis' ? 'Devis → planification' : 'Demande directe') + '</div>'
      + '</div>';
  });
  html += '</div></div></div>';
  zone.innerHTML = html;
  zone.scrollTop = 0;
}

function lancerParcours(id) {
  var secteur = SECTEURS.find(function(s){ return s.id === id; });
  screensData = PARCOURS[id];
  current = 0;
  // Tag secteur dans la barre
  var tag = document.getElementById('topbar-tag');
  tag.textContent = secteur.nom.toUpperCase();
  tag.style.background = secteur.couleur;
  tag.style.display = 'inline-block';
  // Construire les points de progression
  progress.innerHTML = '';
  for (var i = 0; i < screensData.length; i++) {
    var dot = document.createElement('div'); dot.className = 'nav-dot'; progress.appendChild(dot);
  }
  navbar.style.display = 'flex';
  renderScreen();
}

function renderScreen() {
  zone.innerHTML = '<div class="screen active">' + screensData[current].html + '</div>';
  var dots = progress.querySelectorAll('.nav-dot');
  dots.forEach(function(d, i) {
    d.className = 'nav-dot' + (i < current ? ' done' : (i === current ? ' current' : ''));
  });
  document.getElementById('screen-name').textContent = screensData[current].name;
  document.getElementById('btn-prev').disabled = false;
  var next = document.getElementById('btn-next');
  if (current === screensData.length - 1) next.textContent = '↻ Autre métier';
  else if (current === 0) next.textContent = 'Démarrer →';
  else next.textContent = 'Suivant →';
  zone.scrollTop = 0;
}

function nextScreen() {
  if (current === screensData.length - 1) { renderMenu(); return; }
  current++; renderScreen();
}
function prevScreen() {
  if (current === 0) { renderMenu(); return; }
  current--; renderScreen();
}

// Swipe
var startX = 0;
zone.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
zone.addEventListener('touchend', function(e){
  if (navbar.style.display === 'none') return;
  var dx = e.changedTouches[0].clientX - startX;
  if (dx < -60) nextScreen();
  if (dx > 60) prevScreen();
}, {passive:true});

renderMenu();
</script>
